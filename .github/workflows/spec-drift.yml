name: spec-drift
on:
  schedule: [{ cron: "0 13 * * 1" }]
  workflow_dispatch:
# Nothing by default; the job asks for exactly what it uses.
permissions: {}
env:
  ISSUE_TITLE: "Gorelo API spec drift: breaking change blocks regeneration"
  ISSUE_LABEL: spec-drift
jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the spec-drift branch
      pull-requests: write # open or update the drift PR
      issues: write # report drift that cannot be regenerated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch specs (never committed)
        run: |
          curl -fsSL https://api.usw.gorelo.io/swagger/v1.0/swagger.json -o usw.swagger.json
          curl -fsSL https://api.aue.gorelo.io/swagger/v1.0/swagger.json -o aue.swagger.json
          if ! cmp -s <(jq -S .paths usw.swagger.json) <(jq -S .paths aue.swagger.json); then
            echo "::warning::usw and aue specs differ; generating from usw"
          fi
      # spec-diff exits non-zero when the new spec cannot be planned: Gorelo renamed or removed an
      # operation that has an override, two operations map to one action name, or a $ref does not
      # resolve. That is the breaking kind of drift and there is no regenerated code to put in a PR,
      # so it is reported as an issue and the job still fails.
      - name: Diff
        id: diff
        run: |
          if ! npx tsx server/scripts/spec-diff.ts usw.swagger.json > drift.md 2> diff-error.log; then
            cat diff-error.log >&2
            exit 1
          fi
          cat diff-error.log >&2
      - name: Report breaking drift in an issue
        if: failure() && steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The spec-drift run could not plan the current Gorelo API spec, so nothing was regenerated and no pull request was opened."
            echo
            echo "This usually means Gorelo renamed or removed an operation that has an entry in \`server/tool-map.ts\`, two operations now map to the same action name, or the spec has a \`\$ref\` that does not resolve."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            # The text comes from a remote spec: keep it inside the fence and within the body limit.
            # shellcheck disable=SC2016
            if [ -s diff-error.log ]; then tail -c 20000 diff-error.log | sed 's/```/`` `/g'; else echo "(no output captured)"; fi
            echo '```'
            echo
            echo "To reproduce: download the spec and run \`npm run spec-diff -- usw.swagger.json\`."
          } > issue.md
          # One open issue per problem: reuse it if it is already there.
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh label create "$ISSUE_LABEL" --color D93F0B \
              --description "Gorelo API spec drift" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --body-file issue.md --label "$ISSUE_LABEL" ||
              gh issue create --title "$ISSUE_TITLE" --body-file issue.md
          fi
      # PRs opened with GITHUB_TOKEN do not trigger ci.yml, so every check runs here and failures
      # are reported in the PR body (and the PR opened as a draft) instead of stopping the job.
      - name: Regenerate, build, test
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          { npm run codegen -- --spec usw.swagger.json && npm run build && npm test; } 2>&1 | tee tests.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Validate plugin
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            npx -y @anthropic-ai/claude-code@2.1.284 plugin validate . &&
            npx -y @anthropic-ai/claude-code@2.1.284 plugin validate .claude-plugin/plugin.json
          } 2>&1 | tee validate.log
      - name: Report check failures in the PR body
        if: >-
          steps.tests.outcome == 'failure' || steps.typecheck.outcome == 'failure' ||
          steps.lint.outcome == 'failure' || steps.validate.outcome == 'failure'
        env:
          TESTS: ${{ steps.tests.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          report() {
            [ "$2" = "failure" ] || return 0
            {
              echo
              echo "## ⚠️ $1 failed on the regenerated code"
              echo
              echo '```'
              tail -n 60 "$3" 2>/dev/null || echo "(no output captured)"
              echo '```'
            } >> drift.md
          }
          report "Tests" "$TESTS" tests.log
          report "Typecheck" "$TYPECHECK" typecheck.log
          report "Lint" "$LINT" lint.log
          report "Plugin validation" "$VALIDATE" validate.log
      - name: Open PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: spec-drift
          title: "chore: Gorelo API spec drift"
          body-path: drift.md
          commit-message: "chore: regenerate from Gorelo API spec"
          draft: >-
            ${{ steps.tests.outcome == 'failure' || steps.typecheck.outcome == 'failure' ||
            steps.lint.outcome == 'failure' || steps.validate.outcome == 'failure' }}
          add-paths: |
            server/generated
            server/dist
            server/test/__snapshots__
