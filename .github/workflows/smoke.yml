name: smoke
on:
  schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ vars.GORELO_SMOKE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run smoke
        env:
          GORELO_API_KEY: ${{ secrets.GORELO_READONLY_API_KEY }}
          GORELO_REGION: ${{ vars.GORELO_REGION || 'usw' }}
          GORELO_DATA_DIR: ${{ runner.temp }}/gorelo
