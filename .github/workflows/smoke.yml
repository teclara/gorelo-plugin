name: smoke
on:
  schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ vars.GORELO_SMOKE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run smoke
        env:
          GORELO_API_KEY: ${{ secrets.GORELO_READONLY_API_KEY }}
          GORELO_REGION: ${{ vars.GORELO_REGION || 'usw' }}
          GORELO_DATA_DIR: ${{ runner.temp }}/gorelo
