name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines is >=20 and the bundle targets node20, so the floor is tested too.
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Lint, the build and plugin validation do not depend on the Node version, so they run once.
      # On Node 20 the tests run against the committed bundle, which the Node 22 leg proves current.
      - if: matrix.node == 22
        run: npm run lint
      - if: matrix.node == 22
        run: npm run build
      - run: npm test
      - name: Bundle and generated code are committed and current
        if: matrix.node == 22
        run: git diff --exit-code server/dist server/generated
      - name: Validate plugin
        if: matrix.node == 22
        run: |
          npx -y @anthropic-ai/claude-code@2.1.284 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.284 plugin validate .claude-plugin/plugin.json
